services:
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: backend_db
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval \"db.adminCommand('ping')\" || mongo --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  backend:
    build: .
    container_name : backend_fastapi
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - WATCHFILES_USE_POLLING=true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend_network
    volumes:
      - ./app:/code/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  
networks:
  backend_network:
    driver: bridge
  
volumes:
  mongodb_data: